<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="50%" stop-color="#7c3aed" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    
    <!-- Accent Gradient for Ticket Emblem -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>

    <!-- Signal Glow Gradient -->
    <linearGradient id="signalGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>

    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Squircle Base with Glow -->
  <rect x="3" y="3" width="58" height="58" rx="16" fill="url(#bgGrad)" filter="url(#iconShadow)"/>

  <!-- Inner Tech Border -->
  <rect x="4.5" y="4.5" width="55" height="55" rx="14.5" fill="none" stroke="rgba(255,255,255,0.2)" stroke-width="1.5" />

  <!-- Modern Ticket Silhouette -->
  <path d="M19 14 C19 12.895 19.895 12 21 12 H43 C44.105 12 45 12.895 45 14 V26 C42.791 26 41 27.791 41 30 C41 32.209 42.791 34 45 34 V50 C45 51.105 44.105 52 43 52 H21 C19.895 52 19 51.105 19 50 V34 C21.209 34 23 32.209 23 30 C23 27.791 21.209 26 19 26 Z" 
        fill="url(#accentGrad)" />

  <!-- Ticket Header Strip -->
  <path d="M21 12 H43 C44.105 12 45 12.895 45 14 V19 H19 V14 C19 12.895 19.895 12 21 12 Z" 
        fill="#7c3aed" fill-opacity="0.25" />

  <!-- Telecom Signal / Lightning Bolt Icon -->
  <path d="M34 16 L25 29 H32 L29 44 L40 28 H33 Z" 
        fill="url(#signalGrad)" />

  <!-- Signal Wave Dots (Network Nodes) -->
  <circle cx="25" cy="47" r="1.8" fill="#4f46e5" />
  <circle cx="32" cy="47" r="1.8" fill="#7c3aed" />
  <circle cx="39" cy="47" r="1.8" fill="#06b6d4" />
</svg>
